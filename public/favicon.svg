  <rect x="5" y="5" width="10" height="10" rx="1.5" fill="#ff9f1c" />
  <rect x="18" y="6" width="8" height="8" rx="1" fill="none" stroke="#ff9f1c" stroke-width="2" />
  <rect x="6" y="18" width="8" height="8" rx="1" fill="none" stroke="#ff9f1c" stroke-width="2" />
  <rect x="18" y="18" width="8" height="8" rx="1" fill="none" stroke="#ff9f1c" stroke-width="2" />
</svg>
